---
- name: Install and configure Odoo 19 (Vina)
  hosts: odoo_servers
  become: true

  vars_prompt:
    - name: backend_ip_input
      prompt: "Enter backend internal IP address"
      private: false

    - name: backend_hostname_input
      prompt: "Enter backend internal hostname"
      private: false
      default: "odoo.internal"


  pre_tasks:

    - name: Set backend network identity
      ansible.builtin.set_fact:
        odoo_backend_ip: "{{ backend_ip_input }}"
        odoo_backend_hostname: "{{ backend_hostname_input }}"
        odoo_domain: "{{ backend_hostname_input }}"
      tags:
        - always


    - name: Debug backend variables
      ansible.builtin.debug:
        msg:
          - "BACKEND IP   = {{ odoo_backend_ip }}"
          - "BACKEND HOST = {{ odoo_backend_hostname }}"
          - "ODOO DOMAIN  = {{ odoo_domain }}"
      tags:
        - always


    - name: Run strict environment pre-checks
      ansible.builtin.import_tasks:
        file: tasks/preflight.yml
      tags:
        - preflight
        - always



  roles:

    # Base OS
    - role: preflight
      tags:
        - preflight

    - role: bootstrap
      tags:
        - bootstrap

    - role: system_update
      tags:
        - system


    # Users / Database
    - role: odoo_user
      tags:
        - odoo_user

    - role: postgresql
      tags:
        - postgresql


    # Runtime
    - role: redis
      tags:
        - redis

    - role: python
      tags:
        - python


    # Validate packages after python
    - role: preflight
      tasks_from: packages
      tags:
        - packages


    # Odoo core
    - role: odoo_source
      tags:
        - odoo_source

    - role: odoo_config
      tags:
        - odoo_config

    - role: odoo_systemd
      tags:
        - systemd


    # Vina backend API
    - role: vina_api
      tags:
        - api


    # Database initialization
    - role: database_init
      tags:
        - database


    # Default Odoo applications
    - role: odoo_apps
      tags:
        - apps


    # Reverse proxy
    - role: nginx
      tags:
        - nginx


    # Internal CA + HTTPS
    - role: local_ssl
      tags:
        - local_ssl


    # Security
    - role: firewall
      tags:
        - firewall

    - role: backup
      tags:
        - backup

    - role: fail2ban
      tags:
        - fail2ban

    - role: logrotate
      tags:
        - logrotate


    # OCA
    - role: oca_install
      tags:
        - oca

    - role: addon_path
      tags:
        - addons


    # Validation
    - role: healthcheck
      tags:
        - healthcheck


    # Cleanup
    - role: cleanup
      tags:
        - cleanup



  post_tasks:

    - name: Final checks and installation summary
      ansible.builtin.import_tasks:
        file: tasks/final_check.yml
      tags:
        - final_check
        - always
