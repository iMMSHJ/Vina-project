---
# ==========================================
# Stage 1: Install Odoo base + pause for database creation
# ==========================================
- name: Stage 1 - Install Odoo base
  hosts: odoo_servers
  become: true

  vars_prompt:
    - name: admin_passwd
      prompt: "Master Password for Wizard"
      private: true
      confirm: true

    - name: odoo_backend_ip
      prompt: |
        Please enter internal server IP (example: 192.168.10.50)
        ⚠️ This IP is used for SSL certificate and Nginx configuration.
      private: false

    - name: odoo_backend_hostname
      prompt: "Internal hostname (default: odoo.internal)"
      default: "odoo.internal"
      private: false

    - name: db_name
      prompt: "Database name (default: odoo)"
      default: "odoo"
      private: false

    - name: db_password
      prompt: "PostgreSQL password"
      private: true
      confirm: true

  pre_tasks:
    - name: Validate odoo_backend_ip
      ansible.builtin.assert:
        that:
          - odoo_backend_ip is defined
          - odoo_backend_ip | ansible.utils.ipaddr
        fail_msg: |
          ❌ Invalid IP address!
          Please enter a valid IP address (example: 192.168.10.50).

  roles:
    - role: preflight
    - role: bootstrap
    - role: system_update
    - role: odoo_user
    - role: postgresql
    - role: redis
    - role: python
    - role: preflight
      tasks_from: packages
    - role: odoo_source
    - role: odoo_config
    - role: odoo_systemd
    - role: database_init
    - role: nginx
    - role: local_ssl
    - role: firewall

  tasks:
    - name: Ensure Odoo service is started
      ansible.builtin.systemd:
        name: odoo
        state: started
        enabled: true

    - name: Wait until Odoo is ready on port 8069
      ansible.builtin.wait_for:
        port: 8069
        host: 127.0.0.1
        delay: 3
        timeout: 90

    - name: Wait for HTTPS response
      ansible.builtin.uri:
        url: "https://{{ odoo_backend_ip }}"
        validate_certs: false
        status_code: [200, 303, 307, 400, 404]
      register: result
      retries: 15
      delay: 3
      until: result is succeeded
      when: nginx_enable | default(true) and ssl_enable | default(true)

    - name: Include database creation pause task
      ansible.builtin.include_tasks: tasks/wait_for_database.yml


# ==========================================
# Stage 2: Install OCA modules after database creation
# ==========================================
- name: Stage 2 - Install OCA modules after DB creation
  hosts: odoo_servers
  become: true

  roles:
    - role: oca_install
    - role: addon_path
    - role: healthcheck

  post_tasks:
    - name: Final checks
      ansible.builtin.import_tasks:
        file: tasks/final_check.yml
      tags: [final_check, always]
