---
# site.yml — Master playbook (ترتیب اجرا مطابق install.sh:139-161 و README.md بخش ۳)
- name: Install and configure Odoo 19 (Vina)
  hosts: odoo_servers
  become: true

  pre_tasks:
    - name: Run strict environment pre-checks (Ubuntu version, RAM, disk, network)
      ansible.builtin.import_tasks: tasks/preflight.yml
      tags: [preflight, always]

  roles:
    - preflight          # 00-precheck + 00-preflight (بخش اول: بررسی OS/سخت‌افزار)
    - bootstrap           # 01
    - system_update        # 02
    - odoo_user              # 03
    - postgresql               # 04
    - redis                      # 05
    - python                       # 06
    - role: preflight               # preflight (dependency validation) - بخش دوم، بعد از نصب python
      tasks_from: packages
    - odoo_source                     # 07
    - odoo_config                       # 08
    - database_init                       # 08b
    - odoo_systemd                          # 09
    - nginx                                   # 10
    - local_ssl                                 # 11
    - firewall                                    # 12
    - backup                                        # 13
    - fail2ban                                        # 14 (security)
    - logrotate                                         # 15
    - oca_install                                         # 17
    - addon_path                                            # 18
    - healthcheck                                             # 16

  post_tasks:
    - name: Final checks and installation summary
      ansible.builtin.import_tasks: tasks/final_check.yml
      tags: [final_check, always]
