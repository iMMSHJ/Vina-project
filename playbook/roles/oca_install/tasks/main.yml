---
- name: Ensure OCA root directory exists
  file:
    path: "{{ oca_dir }}"
    state: directory
    owner: odoo
    group: odoo
    mode: "0755"

- name: Check if 19.0 branch exists for each repo
  command: git ls-remote --heads "https://github.com/OCA/{{ item }}.git" refs/heads/{{ oca_odoo_branch }}
  loop: "{{ oca_repositories }}"
  register: branch_check
  changed_when: false
  failed_when: false

- name: Clone OCA repositories (19.0 branch if available, else default)
  git:
    repo: "https://github.com/OCA/{{ item.item }}.git"
    dest: "{{ oca_dir }}/{{ item.item }}"
    depth: 1
    version: "{{ oca_odoo_branch if item.stdout != '' else omit }}"
  become: true
  become_user: odoo
  loop: "{{ branch_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: oca_clone_result
  retries: 5
  delay: 10
  until: oca_clone_result is succeeded
  ignore_errors: true

- name: Report OCA repositories that failed to clone
  ansible.builtin.debug:
    msg: >-
      WARNING: the following OCA repos could not be cloned after retries
      (likely a transient GitHub/network issue) and were skipped:
      {{ oca_clone_result.results
         | selectattr('failed', 'defined')
         | selectattr('failed')
         | map(attribute='item.item')
         | list }}
  when: oca_clone_result.results | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0

- name: Ensure ownership of OCA directory
  file:
    path: "{{ oca_dir }}"
    owner: odoo
    group: odoo
    recurse: true
