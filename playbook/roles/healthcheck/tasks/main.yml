---
- name: Check required services
  command: systemctl is-active --quiet {{ item }}
  loop:
    - postgresql
    - odoo
  register: core_services
  changed_when: false
  failed_when: false

- name: Check nginx service
  command: systemctl is-active --quiet nginx
  register: nginx_service
  changed_when: false
  failed_when: false
  when: nginx_enable

- name: Check fail2ban service
  command: systemctl is-active --quiet fail2ban
  register: fail2ban_service
  changed_when: false
  failed_when: false
  when: fail2ban_enable

- name: Check Odoo port 8069
  ansible.builtin.command: ss -tulpn
  register: ss_output
  changed_when: false

- name: Evaluate port checks
  set_fact:
    port_8069_open: "{{ ':8069' in ss_output.stdout }}"
    port_80_open: "{{ ':80' in ss_output.stdout }}"
    port_443_open: "{{ ':443' in ss_output.stdout }}"

- name: Check HTTPS redirect for Odoo domain
  uri:
    url: "https://{{ odoo_backend_ip }}"
    validate_certs: false
    return_content: true
  register: https_check
  failed_when: false
  when: nginx_enable and ssl_enable

- name: Check disk usage
  command: df -h /
  changed_when: false
  register: disk_usage

- name: Check for existing PostgreSQL backup
  find:
    paths: "{{ backup_dir }}/postgres"
    patterns: "*.gz"
  register: pg_backup_files
  when: backup_enable

- name: Print healthcheck summary
  debug:
    msg:
      - "postgresql/odoo active: {{ core_services.results | map(attribute='rc') | list }}"
      - "port 8069 open: {{ port_8069_open }}"
      - "port 80 open: {{ port_80_open }}"
      - "port 443 open: {{ port_443_open }}"
      - "backup found: {{ (pg_backup_files.matched | default(0)) > 0 }}"
