---
- name: Deploy odoo logrotate config
  copy:
    dest: /etc/logrotate.d/odoo
    content: |
      /opt/odoo/logs/*.log {
          daily
          rotate 14
          size 50M
          missingok
          notifempty
          compress
          delaycompress
          copytruncate
          create 0640 odoo odoo
      }
    mode: "0644"
  register: logrotate_conf

- name: Validate logrotate config
  command: logrotate -d /etc/logrotate.d/odoo
  changed_when: false
  when: logrotate_conf.changed
