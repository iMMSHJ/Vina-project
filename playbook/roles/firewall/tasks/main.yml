---
- name: Skip firewall setup if disabled
  meta: end_play
  when: not firewall_enable

- name: Install ufw
  apt:
    name: ufw
    state: present

- name: Check current ufw status
  command: ufw status
  register: ufw_status
  changed_when: false

- name: Reset ufw only if inactive
  command: ufw --force reset
  when: "'Status: active' not in ufw_status.stdout"

- name: Set default incoming policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow required ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "80"
    - "443"

- name: Enable ufw
  community.general.ufw:
    state: enabled
