---
# roles/preflight/tasks/main.yml
# ترکیب منطق 00-precheck.sh و 00-preflight.sh

- name: Check if running as root (via become)
  assert:
    that: ansible_user_uid == 0 or ansible_become
    fail_msg: "Installer must run with sudo/become privilege"
    success_msg: "Running with proper privilege"

- name: Gather OS facts
  setup:
    gather_subset:
      - '!all'
      - 'distribution'
      - 'hardware'

- name: Display OS information
  debug:
    msg: "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"

- name: Warn if not Ubuntu
  debug:
    msg: "WARNING: This playbook is designed for Ubuntu"
  when: ansible_distribution != "Ubuntu"

- name: Display system resources
  debug:
    msg:
      - "Architecture: {{ ansible_architecture }}"
      - "CPU Cores: {{ ansible_processor_vcpus }}"
      - "RAM: {{ ansible_memtotal_mb }} MB"
      - "Free Disk on /: {{ ansible_mounts | selectattr('mount', 'equalto', '/') | map(attribute='size_available') | first | human_readable }}"

- name: Test internet connectivity
  command: ping -c 1 -W 2 8.8.8.8
  register: ping_result
  ignore_errors: yes
  changed_when: false

- name: Report internet connectivity
  debug:
    msg: "{{ 'Internet connection OK' if ping_result.rc == 0 else 'WARNING: Internet connection failed' }}"

- name: Check critical build packages (preflight)
  package_facts:
    manager: apt

- name: Verify build-essential presence
  assert:
    that: "'build-essential' in ansible_facts.packages"
    fail_msg: "Missing package: build-essential"

- name: Verify pkg-config presence
  assert:
    that: "'pkg-config' in ansible_facts.packages"
    fail_msg: "Missing package: pkg-config"

- name: Verify python3.12-dev presence
  assert:
    that: "'python3.12-dev' in ansible_facts.packages"
    fail_msg: "Missing package: python3.12-dev"

- name: Verify python3.12-venv presence
  assert:
    that: "'python3.12-venv' in ansible_facts.packages"
    fail_msg: "Missing package: python3.12-venv"

- name: Verify libpq-dev presence
  assert:
    that: "'libpq-dev' in ansible_facts.packages"
    fail_msg: "Missing package: libpq-dev"

- name: Verify libldap2-dev presence
  assert:
    that: "'libldap2-dev' in ansible_facts.packages"
    fail_msg: "Missing package: libldap2-dev"

- name: Verify libsasl2-dev presence
  assert:
    that: "'libsasl2-dev' in ansible_facts.packages"
    fail_msg: "Missing package: libsasl2-dev"

- name: Check Python header file
  stat:
    path: /usr/include/python3.12/Python.h
  register: python_header

- name: Assert Python header exists
  assert:
    that: python_header.stat.exists
    fail_msg: "Python headers missing at /usr/include/python3.12/Python.h"
    success_msg: "System requirements satisfied"

- name: Preflight summary
  debug:
    msg: "✓ Pre-check and preflight completed successfully"
