---
# roles/preflight/tasks/packages.yml
# بخش دوم preflight (dependency validation) — طبق README باید *بعد* از نقش python
# فراخوانی شود، چون همان‌جاست که این بسته‌ها نصب می‌شوند. اگر این فایل به‌جای main.yml
# در همان ابتدای site.yml اجرا شود، همیشه با خطا متوقف می‌شود چون هنوز هیچ بسته‌ای نصب نشده.

- name: Check critical build packages (preflight, stage 2)
  package_facts:
    manager: apt

- name: Verify build-essential presence
  assert:
    that: "'build-essential' in ansible_facts.packages"
    fail_msg: "Missing package: build-essential"

- name: Verify pkg-config presence
  assert:
    that: "'pkg-config' in ansible_facts.packages"
    fail_msg: "Missing package: pkg-config"

- name: Verify python3.12-dev presence
  assert:
    that: "'python3.12-dev' in ansible_facts.packages"
    fail_msg: "Missing package: python3.12-dev"

- name: Verify python3.12-venv presence
  assert:
    that: "'python3.12-venv' in ansible_facts.packages"
    fail_msg: "Missing package: python3.12-venv"

- name: Verify libpq-dev presence
  assert:
    that: "'libpq-dev' in ansible_facts.packages"
    fail_msg: "Missing package: libpq-dev"

- name: Verify libldap2-dev presence
  assert:
    that: "'libldap2-dev' in ansible_facts.packages"
    fail_msg: "Missing package: libldap2-dev"

- name: Verify libsasl2-dev presence
  assert:
    that: "'libsasl2-dev' in ansible_facts.packages"
    fail_msg: "Missing package: libsasl2-dev"

- name: Check Python header file
  stat:
    path: /usr/include/python3.12/Python.h
  register: python_header

- name: Assert Python header exists
  assert:
    that: python_header.stat.exists
    fail_msg: "Python headers missing at /usr/include/python3.12/Python.h"
    success_msg: "System requirements satisfied"

- name: Preflight (stage 2) summary
  debug:
    msg: "✓ Build-dependency validation completed successfully"
