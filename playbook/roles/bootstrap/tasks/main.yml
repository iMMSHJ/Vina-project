---
- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true

- name: Verify apt-packages.list exists
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/files/apt-packages.list"
  register: apt_packages_file

- name: Fail if package list not found
  ansible.builtin.fail:
    msg: "Package list not found: apt-packages.list"
  when: not apt_packages_file.stat.exists

- name: Read package list (ignore blank lines and comments)
  ansible.builtin.set_fact:
    bootstrap_packages: "{{ lookup('file', 'apt-packages.list').splitlines()
                            | reject('match', '^\\s*(#|$)')
                            | list }}"

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ bootstrap_packages }}"
    state: present

- name: Ensure locale-gen is available
  ansible.builtin.apt:
    name: locales
    state: present
  when: ansible_facts.getent_passwd is not defined  # placeholder guard
  # جایگزین دقیق‌تر بررسی وجود locale-gen:

- name: Check if locale-gen exists
  ansible.builtin.command: which locale-gen
  register: locale_gen_check
  changed_when: false
  failed_when: false

- name: Install locales package if missing
  ansible.builtin.apt:
    name: locales
    state: present
  when: locale_gen_check.rc != 0
