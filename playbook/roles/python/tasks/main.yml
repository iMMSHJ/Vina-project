---
- name: Install Python build dependencies
  ansible.builtin.apt:
    name:
      - python3.12-dev
      - python3.12-venv
      - build-essential
      - pkg-config
      - libpq-dev
      - libldap2-dev
      - libsasl2-dev
    state: present
    update_cache: true

- name: Create Odoo directory tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ odoo_user }}"
    group: "{{ odoo_group }}"
  loop:
    - "{{ odoo_home }}"
    - "{{ odoo_source_dir }}"
    - "{{ odoo_custom_addons }}"
    - "{{ odoo_oca }}"

- name: Set recursive ownership on Odoo home (pass 1)
  ansible.builtin.file:
    path: "{{ odoo_home }}"
    owner: "{{ odoo_user }}"
    group: "{{ odoo_group }}"
    recurse: true

- name: Check if virtualenv already exists
  ansible.builtin.stat:
    path: "{{ odoo_venv }}"
  register: odoo_venv_stat

- name: Create Python virtual environment
  ansible.builtin.command: "python3 -m venv {{ odoo_venv }}"
  when: not odoo_venv_stat.stat.exists

- name: Upgrade pip, setuptools, wheel
  ansible.builtin.pip:
    name:
      - pip
      - setuptools
      - wheel
    state: latest
    virtualenv: "{{ odoo_venv }}"

- name: Check if python-packages.list exists
  ansible.builtin.stat:
    path: "{{ role_path }}/files/python-packages.list"
  register: py_pkg_list
  delegate_to: localhost
  run_once: true

- name: Copy python-packages.list to remote
  ansible.builtin.copy:
    src: python-packages.list
    dest: /tmp/python-packages.list
  when: py_pkg_list.stat.exists

- name: Install Python packages from requirements file
  ansible.builtin.pip:
    requirements: /tmp/python-packages.list
    virtualenv: "{{ odoo_venv }}"
  when: py_pkg_list.stat.exists

- name: Warn if python-packages.list missing
  ansible.builtin.debug:
    msg: "Python package list not found — skipping"
  when: not py_pkg_list.stat.exists

# --- Headless report engine (Chromium) ---

- name: Check if google-chrome is installed
  ansible.builtin.command: which google-chrome
  register: chrome_check
  changed_when: false
  failed_when: false
  when: report_engine == "chromium"

- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when:
    - report_engine == "chromium"
    - chrome_check.rc != 0

- name: Download and dearmor Google Chrome signing key
  ansible.builtin.shell: >
    curl -fsSL https://dl.google.com/linux/linux_signing_key.pub |
    gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
  args:
    creates: /etc/apt/keyrings/google-chrome.gpg
  when:
    - report_engine == "chromium"
    - chrome_check.rc != 0

- name: Add Google Chrome APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/google-chrome.list
    content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main\n"
  when:
    - report_engine == "chromium"
    - chrome_check.rc != 0
  register: chrome_repo

- name: Update APT cache after adding Chrome repo
  ansible.builtin.apt:
    update_cache: true
  when: chrome_repo is changed

- name: Install google-chrome-stable
  ansible.builtin.apt:
    name: google-chrome-stable
    state: present
  when:
    - report_engine == "chromium"
    - chrome_check.rc != 0

- name: Warn if report_engine is not chromium
  ansible.builtin.debug:
    msg: "REPORT_ENGINE is not chromium — skipping browser install"
  when: report_engine != "chromium"

# --- rtlcss ---

- name: Check if npm exists
  ansible.builtin.command: which npm
  register: npm_check
  changed_when: false
  failed_when: false

- name: Check if rtlcss exists
  ansible.builtin.command: which rtlcss
  register: rtlcss_check
  changed_when: false
  failed_when: false
  when: npm_check.rc == 0

- name: Install rtlcss globally via npm
  community.general.npm:
    name: rtlcss
    global: true
  when:
    - npm_check.rc == 0
    - rtlcss_check.rc != 0

- name: Warn if npm missing (RTL rendering risk)
  ansible.builtin.debug:
    msg: "npm not found — RTL languages may render incorrectly"
  when: npm_check.rc != 0

- name: Restore Odoo ownership (final pass)
  ansible.builtin.file:
    path: "{{ odoo_home }}"
    owner: "{{ odoo_user }}"
    group: "{{ odoo_group }}"
    recurse: true
