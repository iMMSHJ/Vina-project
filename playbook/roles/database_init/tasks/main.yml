---
- name: Check PostgreSQL user exists
  command: >
    psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ odoo_db_user }}'"
  become: true
  become_user: postgres
  register: db_user_check
  changed_when: false


- name: Create Odoo PostgreSQL user
  command: >
    psql -c "CREATE USER {{ odoo_db_user }} WITH PASSWORD '{{ odoo_db_password }}';"
  become: true
  become_user: postgres
  when: db_user_check.stdout | trim != "1"


- name: Allow PostgreSQL user createdb privilege
  command: >
    psql -c "ALTER USER {{ odoo_db_user }} CREATEDB;"
  become: true
  become_user: postgres
