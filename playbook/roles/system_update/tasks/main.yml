---
# roles/system_update/tasks/main.yml
# System upgrade, timezone, locale configuration

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Upgrade all system packages
  apt:
    upgrade: dist
    autoremove: yes
    autoclean: yes
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Set system timezone
  community.general.timezone:
    name: "{{ odoo_timezone }}"

- name: Generate en_US.UTF-8 locale
  community.general.locale_gen:
    name: en_US.UTF-8
    state: present

- name: Set system locale to en_US.UTF-8
  lineinfile:
    path: /etc/default/locale
    regexp: '^LANG='
    line: 'LANG=en_US.UTF-8'
    create: yes

- name: Apply locale update
  command: update-locale LANG=en_US.UTF-8
  changed_when: false

- name: Clean apt cache and remove unused packages
  apt:
    autoremove: yes
    autoclean: yes

- name: Display timezone confirmation
  debug:
    msg: "Timezone set to {{ odoo_timezone }}"
