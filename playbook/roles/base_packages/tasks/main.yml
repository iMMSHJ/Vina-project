---
# roles/base_packages/tasks/main.yml
# Install all system dependencies for Odoo 19

- name: Install core build tools
  apt:
    name:
      - build-essential
      - pkg-config
      - iputils-ping
      - wget
      - curl
      - git
      - unzip
      - ca-certificates
      - gnupg
      - lsb-release
    state: present
    update_cache: yes

- name: Install Python development packages
  apt:
    name:
      - python3.12
      - python3.12-dev
      - python3.12-venv
      - python3-pip
      - python3-wheel
      - python3-setuptools
    state: present

- name: Install PostgreSQL client and development libraries
  apt:
    name:
      - libpq-dev
      - postgresql-client
    state: present

- name: Install LDAP and SASL development libraries
  apt:
    name:
      - libldap2-dev
      - libsasl2-dev
    state: present

- name: Install SSL/TLS libraries
  apt:
    name:
      - libssl-dev
      - openssl
    state: present

- name: Install XML/XSLT libraries
  apt:
    name:
      - libxml2-dev
      - libxslt1-dev
    state: present

- name: Install image processing libraries
  apt:
    name:
      - libjpeg-dev
      - libpng-dev
      - libtiff-dev
      - libfreetype6-dev
      - liblcms2-dev
      - libwebp-dev
      - zlib1g-dev
    state: present

- name: Install fonts for PDF rendering
  apt:
    name:
      - fonts-liberation
      - fonts-noto
      - fonts-noto-cjk
      - fonts-dejavu-core
      - fontconfig
    state: present

- name: Install wkhtmltopdf and dependencies
  apt:
    name:
      - wkhtmltopdf
      - xfonts-75dpi
      - xfonts-base
    state: present

- name: Install Chromium for PDF rendering
  apt:
    name:
      - chromium-browser
    state: present

- name: Install Node.js and npm
  apt:
    name:
      - nodejs
      - npm
    state: present

- name: Install lessc and rtlcss via npm
  npm:
    name: "{{ item }}"
    global: yes
  loop:
    - less
    - less-plugin-clean-css
    - rtlcss

- name: Install compression libraries
  apt:
    name:
      - libbz2-dev
      - liblzma-dev
    state: present

- name: Install additional utilities
  apt:
    name:
      - sudo
      - nano
      - vim
      - htop
      - net-tools
      - ufw
    state: present

- name: Verify critical packages installed
  package_facts:
    manager: apt

- name: Assert build-essential is present
  assert:
    that: "'build-essential' in ansible_facts.packages"

- name: Assert Python 3.12 dev is present
  assert:
    that: "'python3.12-dev' in ansible_facts.packages"

- name: Display package installation summary
  debug:
    msg: "✓ All system dependencies installed successfully"
