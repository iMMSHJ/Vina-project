---
- name: Deploy Odoo systemd unit
  ansible.builtin.template:
    src: odoo.service.j2
    dest: /etc/systemd/system/odoo.service
    mode: "0644"
  notify: daemon-reload

- name: Flush handlers to apply daemon-reload
  ansible.builtin.meta: flush_handlers

- name: Enable Odoo service (do not force-start, matches script)
  ansible.builtin.systemd_service:
    name: odoo
    enabled: true
