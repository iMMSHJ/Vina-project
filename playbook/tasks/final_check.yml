---
# tasks/final_check.yml

- name: Wait for Odoo service to stabilize
  ansible.builtin.wait_for:
    port: 8069
    delay: 5
    timeout: 60


- name: Check Odoo HTTP response
  ansible.builtin.uri:
    url: "http://127.0.0.1:8069"
    return_content: false
  register: odoo_http
  failed_when: false


- name: Check Nginx proxy (if enabled)
  ansible.builtin.uri:
    url: "https://{{ odoo_backend_ip }}"
    validate_certs: false
    return_content: false
  register: nginx_https
  failed_when: false
  when:
    - nginx_enable
    - ssl_enable


- name: Print installation summary
  ansible.builtin.debug:
    msg:
      - "========================================="
      - "Odoo 19 Installation Complete"
      - "========================================="
      - "Backend IP: {{ odoo_backend_ip }}"
      - "HTTPS Endpoint: https://{{ odoo_backend_ip }}"
      - "Odoo Internal Port: 8069 (private only)"
      - "Admin user: {{ odoo_admin_user }}"
      - "Database: {{ odoo_db_name }}"
      - "Nginx HTTPS: {{ 'Enabled' if (nginx_enable and ssl_enable) else 'Disabled' }}"
      - "Backup: {{ 'Enabled' if backup_enable else 'Disabled' }}"
      - "OCA Modules: Installed in {{ oca_dir }}"
      - "========================================="
      - "Next steps:"
      - "1. Import internal CA certificate to clients"
      - "2. Configure FastAPI backend connection"
      - "3. Review logs: /opt/odoo/logs/"
      - "========================================="
