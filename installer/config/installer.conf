# ==========================================
# Vina Business Server Installer
# Main Configuration
# ==========================================

# Odoo
ODOO_VERSION="19.0"
ODOO_EDITION="community"
ODOO_CORE_MODULES="base,mail,contacts,calendar,project,maintenance,hr,hr_timesheet,sale_management"

# Paths
ODOO_HOME="/opt/odoo"
ODOO_SOURCE="/opt/odoo/src/odoo"
ODOO_VENV="/opt/odoo/venv"
ODOO_CUSTOM_ADDONS="/opt/odoo/custom_addons"
ODOO_OCA="/opt/odoo/oca"

# Linux User
ODOO_USER="odoo"
ODOO_GROUP="odoo"

# PostgreSQL
POSTGRES_VERSION="16"
POSTGRES_USER="odoo"
ODOO_DB_NAME="vina"

# Redis
REDIS_VERSION="7"

# Node
NODE_VERSION="22"

# Python
PYTHON_VERSION="3"

# Reports (installs Google Chrome headless for PDF rendering + rtlcss for RTL languages)
REPORT_ENGINE="chromium"

# Production mode. "no" = no dev_mode, worker processes sized to CPU
# cores, memory/time limits applied. Only set "yes" for troubleshooting.
ODOO_DEV_MODE="no"

# Backup schedule (cron time spec, used by 13-backup.sh)
BACKUP_CRON_SCHEDULE="0 2 * * *"

# Initial database created by 19-database-init.sh. Modules are a
# comma-separated addons list — anything in addons_path (core, custom,
# or OCA) can be named here and will be installed automatically.
ODOO_DB_NAME="odoo"
ODOO_INSTALL_MODULES="base"

# Network
ODOO_PORT="8069"
LONGPOLLING_PORT="8072"

# Domain used by the nginx / SSL modules
ODOO_DOMAIN="odoo.local"

# Web Server
NGINX_ENABLE="yes"

# Security
FIREWALL_ENABLE="yes"
FAIL2BAN_ENABLE="yes"
FAIL2BAN_BANTIME="3600"
FAIL2BAN_FINDTIME="600"
FAIL2BAN_MAXRETRY="5"

# SSL
SSL_ENABLE="yes"
SSL_COUNTRY="IR"

# Backup
BACKUP_ENABLE="yes"


# Odoo Source
ODOO_REPO="https://github.com/odoo/odoo.git"
ODOO_BRANCH="19.0"

# Timezone
TIMEZONE="Asia/Tehran"

# SSL Certificate Subject
SSL_COUNTRY="IR"

# Fail2ban Jails
FAIL2BAN_BANTIME="3600"
FAIL2BAN_FINDTIME="600"
FAIL2BAN_MAXRETRY="5"
FAIL2BAN_IGNOREIP="127.0.0.1/8"
